[project]
name = "trading-lab"
version = "0.1.0"
description = "Sistema multiagente de trading (crypto spot, swing corto) — ver ESPECIFICACION_SISTEMA_TRADING.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "structlog>=24.4,<25.0",
    "binance-connector>=3.11,<4.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.0",  # vectorbt 0.26 usa API interna de numpy retirada en 2.x
    "vectorbt>=0.26,<0.27",
    "plotly>=5.0,<5.19",  # vectorbt 0.26 usa trace types (heatmapgl) retirados en plotly posteriores
    "httpx>=0.27,<1.0",  # alertas Telegram + descarga RSS/JSON fundamental (fase 2), async, encaja con el resto del stack
    "feedparser>=6.0,<7.0",  # parseo de RSS estándar (CoinDesk, The Block) para el almacén PIT (sección 12.2)
    "streamlit>=1.40,<2.0",  # dashboard de solo lectura (fase 3) — servicio nuevo en docker-compose, no toca FastAPI/app
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# DECISION: session-scoped loop — `db/session.py` crea el engine/pool async
# UNA vez a nivel de módulo; con el default de pytest-asyncio (loop nuevo
# por test) las conexiones pooladas de un test se reutilizan en el loop de
# otro y asyncpg revienta ("Future attached to a different loop"). Detectado
# al añadir tests/integration/test_paper_ledger.py.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests/unit"]
markers = [
    "integration: necesita Postgres real (DATABASE_URL); correr con: pytest tests/integration",
]

[tool.mypy]
strict = true
files = ["core", "services/risk", "services/execution", "notifications", "services/fundamental", "services/reporting"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "services", "db", "notifications", "backtests", "journal", "scripts", "dashboard"]
